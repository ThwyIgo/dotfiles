events {}

http {
  # Upstreams dos serviços
  upstream frontend_angular {
      server localhost:60001;
  }
  
  upstream portal_backend {
      server localhost:60000;
  }
  
  upstream keycloak {
      server localhost:8082;
  }
  
  upstream microsservico_1 {
      server localhost:5001;
  }
  
  upstream microsservico_2 {
      server localhost:5002;
  }
  
  # 1. Se houver cookie access_token, monta "Bearer <token>"; senão fica vazio ""
  map $cookie_access_token $token_from_cookie {
      default "Bearer $cookie_access_token";
      ""      "";
  }
  # 2. Se o cliente já enviou Authorization (default), mantém $http_authorization.
  #    Se $http_authorization for vazio (""), usa $token_from_cookie.
  map $http_authorization $auth_header {
      default $http_authorization;
      ""      $token_from_cookie;
  }
  
  server {
      listen 80;
      listen 443 ssl;
      http2 on;
      server_name _;
  
      # Configurações SSL/TLS
      ssl_certificate /etc/nixos/config/fullchain.pem;
      ssl_certificate_key /etc/nixos/config/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
  
      # Cabeçalhos padrão de Proxy
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
  
      # -------------------------------------------------------------
      # 1. Keycloak (Identity & Access Management)
      # Prefixo: /keycloak -> repassado ao upstream com o prefixo /keycloak
      # Exemplo: /keycloak/realms/... -> http://keycloak/keycloak/realms/...
      # -------------------------------------------------------------
      location /keycloak {
          # Injeta o Authorization header com o token extraído do cookie
          proxy_set_header Authorization $auth_header;
  
          proxy_pass https://keycloak;
  
          # Cabeçalhos e buffers necessários para o Keycloak
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port $server_port;
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
      }
  
      # -------------------------------------------------------------
      # 2. Portal Backend (API de Autenticação / ROPC / Sessão)
      # Prefixo: /portal/api/ -> repassado ao upstream sem o prefixo
      # Exemplo: /portal/api/Auth -> http://portal_backend/Auth
      # -------------------------------------------------------------
      location /portal/api/ {
          # Injeta o Authorization header com o token extraído do cookie
          proxy_set_header Authorization $auth_header;
  
          proxy_pass http://portal_backend/;
  
          proxy_set_header Host $host:$server_port;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Port $server_port;
          proxy_set_header X-Forwarded-Prefix /portal/api;
  
          # Garante que os cabeçalhos Set-Cookie retornados pelo ASP.NET sejam repassados ao cliente
          proxy_pass_header Set-Cookie;
      }
  
      location = /portal/api {
          return 301 /portal/api/;
      }
  
      # -------------------------------------------------------------
      # 3. Microsserviço 1 (Resource Server com injeção de Bearer Token)
      # Prefixo: /microsservico-1/ -> repassado ao upstream sem o prefixo
      # Exemplo: /microsservico-1/api/pedidos -> http://microsservico_1/api/pedidos
      # -------------------------------------------------------------
      location /microsservico-1/ {
          # Injeta o Authorization header com o token extraído do cookie
          proxy_set_header Authorization $auth_header;
  
          proxy_pass http://microsservico_1/;
      }
  
      # -------------------------------------------------------------
      # 4. Microsserviço 2 (Resource Server com injeção de Bearer Token)
      # Prefixo: /microsservico-2/ -> repassado ao upstream sem o prefixo
      # Exemplo: /microsservico-2/api/outro-servico -> http://microsservico_2/api/outro-servico
      # -------------------------------------------------------------
      location /microsservico-2/ {
          # Injeta o Authorization header com o token extraído do cookie
          proxy_set_header Authorization $auth_header;
  
          proxy_pass http://microsservico_2/;
      }
  
      # -------------------------------------------------------------
      # 5. Frontend Angular
      # Prefixo: /frontend/ -> repassado ao upstream sem o prefixo
      # Exemplo: /frontend/dashboard -> http://frontend_angular/dashboard
      # -------------------------------------------------------------
      location /frontend/ {
          proxy_pass http://frontend_angular/;
      }
  
      # Fallback / Rota raiz padrão
      location / {
          proxy_pass http://frontend_angular;
      }
  }
}
